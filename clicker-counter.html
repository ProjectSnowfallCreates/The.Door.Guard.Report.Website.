<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Counter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .counter-section {
            border: 4px solid #007bff;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            background: #f8f9ff;
        }

        .counter-display {
            font-size: 72px;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 123, 255, 0.1);
        }

        .click-button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .click-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.6);
        }

        .click-button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(0, 123, 255, 0.3);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .reset-button {
            padding: 12px 30px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.3);
        }

        .reset-button:hover {
            background: #c82333;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.5);
            transform: translateY(-2px);
        }

        .reset-button:active {
            transform: translateY(0);
        }

        .info-text {
            color: #666;
            font-size: 14px;
            margin-top: 15px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .counter-section {
                padding: 20px;
            }

            .counter-display {
                font-size: 48px;
            }

            .click-button {
                width: 120px;
                height: 120px;
                font-size: 14px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Clicker Counter</h1>
        
        <div class="counter-section">
            <div class="counter-display" id="counterDisplay">0</div>
            <button class="click-button" id="clickButton">CLICK ME</button>
            <p class="info-text">Counts on press AND release</p>
        </div>

        <div class="button-group">
            <button class="reset-button" id="resetButton">Reset Counter</button>
        </div>
    </div>

    <script>
        // Initialize counter
        let clickCount = 0;

        // Get DOM elements
        const clickButton = document.getElementById('clickButton');
        const counterDisplay = document.getElementById('counterDisplay');
        const resetButton = document.getElementById('resetButton');

        // Event: Button pressed down
        clickButton.addEventListener('mousedown', () => {
            clickCount++;
            updateDisplay();
            clickButton.style.transform = 'scale(0.95)';
        });

        // Event: Button released
        clickButton.addEventListener('mouseup', () => {
            clickCount++;
            updateDisplay();
            clickButton.style.transform = 'scale(1)';
        });

        // Event: Touch support for mobile
        clickButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            clickCount++;
            updateDisplay();
        });

        clickButton.addEventListener('touchend', (e) => {
            e.preventDefault();
            clickCount++;
            updateDisplay();
        });

        // Reset button functionality
        resetButton.addEventListener('click', () => {
            clickCount = 0;
            updateDisplay();
        });

        // Update the display
        function updateDisplay() {
            counterDisplay.textContent = clickCount;
        }
    </script>
</body>
</html>
